<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PS Tournament">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="tournament_manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PS Tournament</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: #0a0a0a;
  color: #f0f0f0;
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}
#root { min-height: 100vh; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<!-- ⚠️ Babel 메이저 핀 필수(@7). @latest는 8.x로 올라 preset-react 기본 runtime이 classic→automatic이 되며
     JSX 출력 상단에 `import {jsx} from "react/jsx-runtime"`를 주입 → classic <script> 파싱에러 → 전체 검은화면.
     아래 transform의 runtime:"classic" 강제와 함께 이중 방어. -->
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
<!-- 스코어보드 송출용 Firebase RTDB (ps-scoreboard 연동) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
<div id="root"></div>
<script>
// ──────────────────────────────────────────────────────────
// Playus 백엔드 어댑터 (B 단계 — Firebase Firestore 대체).
// 데이터는 Playus MongoDB tournament-store 컬렉션에 저장.
// same-origin 프록시(/api → 백엔드)라 CORS 불필요.
// ──────────────────────────────────────────────────────────
window.PS_API_BASE = "/api/tournament-store";
window.db = null;        // Firestore 미사용 (어댑터가 대체)
window.authReady = Promise.resolve(); // 익명 인증 불필요

// 데이터는 MongoDB(tournament-store)에 저장하고, 라이브 점수 "송출"만 RTDB로.
// ps-scoreboard(index.html/tv.html) + OBS 오버레이가 RTDB 'scoreboard' 경로를 읽음.
try {
  firebase.initializeApp({
    apiKey: "AIzaSyBkrib1qzN8IE9NcW8tXTfKb4Z6JsOjcvE",
    authDomain: "ps-score-868bb.firebaseapp.com",
    databaseURL: "https://ps-score-868bb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "ps-score-868bb",
    storageBucket: "ps-score-868bb.firebasestorage.app",
    messagingSenderId: "48470302084",
    appId: "1:48470302084:web:b037acc0b58f7e85d191d1",
  });
  window.rtdb = firebase.database(); // pushToScoreboard가 .ref('scoreboard').set() 호출
} catch (e) {
  console.error("scoreboard RTDB init failed:", e);
  window.rtdb = null; // 실패해도 앱은 정상 동작 (송출만 안 됨)
}

// React hooks를 전역으로 노출
const { useState, useEffect, useCallback, useRef, createContext, useContext } = React;

// 렌더 전 치명적 오류를 화면에 노출 — 주입 <script>의 파싱/런타임 에러는 아래 .catch로 안 잡혀
// (별도 실행 컨텍스트). 전역 error/rejection 핸들러로 잡아 #root가 비어있으면 메시지 표시(검은화면 방지).
function psShowFatal(msg) {
  const root = document.getElementById("root");
  if (root && !root.firstChild) {
    root.innerHTML = '<div style="padding:40px;text-align:center;color:#f87171;font-size:14px;line-height:1.7">'
      + '앱 실행 오류<br><span style="color:#9ca3af;font-size:12px;word-break:break-all">'
      + String(msg || "").slice(0, 300) + '</span></div>';
  }
}
window.addEventListener("error", (e) => psShowFatal(e.message || (e.error && e.error.message)));
window.addEventListener("unhandledrejection", (e) => psShowFatal(e.reason && (e.reason.message || e.reason)));

// tournament-app.js 로드 및 실행
fetch("tournament-app.js")
  .then(r => r.text())
  .then(code => {
    // import 구문 제거 (이미 전역으로 로드됨)
    code = code.replace(/^import\s+\{[^}]*\}\s+from\s+["']react["'];?\s*/gm, "");
    // export default → window 할당
    code = code.replace(/export\s+default\s+function\s+App/, "function App");
    // 마지막에 렌더링 코드 추가
    code += "\nReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));";
    // Babel 변환 후 실행 — runtime:"classic"을 명시해 React.createElement로 변환(자동런타임 import 주입 차단).
    const transformed = Babel.transform(code, { presets: [["react", { runtime: "classic" }]] }).code;
    const script = document.createElement("script");
    script.textContent = transformed;
    document.body.appendChild(script);
  })
  .catch(err => {
    document.getElementById("root").innerHTML =
      '<div style="padding:40px;text-align:center;color:#f87171;">앱 로딩 실패: ' + err.message + '</div>';
  });

// PWA 설치 배너 (Chrome/Edge 등 + iOS Safari 안내)
(function () {
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches
    || window.navigator.standalone === true;
  if (isStandalone) return; // 이미 설치됨

  const ua = navigator.userAgent;
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isIOSSafari = isIOS && /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);

  let deferredPrompt = null;

  function buildBanner(message, actionLabel, onAction) {
    if (document.getElementById("ps-install-banner")) return null;
    const styleEl = document.createElement("style");
    styleEl.textContent = "@keyframes psSlideUp{from{transform:translateY(120%);opacity:0}to{transform:translateY(0);opacity:1}}";
    document.head.appendChild(styleEl);

    const wrap = document.createElement("div");
    wrap.id = "ps-install-banner";
    wrap.style.cssText = [
      "position:fixed", "left:12px", "right:12px", "bottom:12px", "z-index:9999",
      "background:#1c3a2a", "color:#f0f0f0", "border:1px solid #2d5a40",
      "border-radius:12px", "padding:12px 14px",
      "box-shadow:0 8px 24px rgba(0,0,0,0.35)",
      "font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif",
      "display:flex", "align-items:center", "gap:10px",
      "animation:psSlideUp 0.3s ease-out",
    ].join(";");

    const icon = document.createElement("img");
    icon.src = "icon-192.png";
    icon.style.cssText = "width:40px;height:40px;border-radius:8px;flex-shrink:0";
    wrap.appendChild(icon);

    const textBox = document.createElement("div");
    textBox.style.cssText = "flex:1;min-width:0";
    const title = document.createElement("div");
    title.textContent = "빠소 앱 설치";
    title.style.cssText = "font-weight:700;font-size:14px;margin-bottom:2px";
    const msg = document.createElement("div");
    msg.innerHTML = message;
    msg.style.cssText = "font-size:12px;color:#b8d4c3;line-height:1.4";
    textBox.appendChild(title);
    textBox.appendChild(msg);
    wrap.appendChild(textBox);

    if (actionLabel && onAction) {
      const btn = document.createElement("button");
      btn.textContent = actionLabel;
      btn.style.cssText = "background:#4ade80;color:#0a0a0a;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;font-family:inherit";
      btn.onclick = onAction;
      wrap.appendChild(btn);
    }

    const close = document.createElement("button");
    close.textContent = "✕";
    close.setAttribute("aria-label", "닫기");
    close.style.cssText = "background:transparent;color:#b8d4c3;border:none;font-size:18px;cursor:pointer;padding:4px 8px;flex-shrink:0";
    close.onclick = () => {
      wrap.remove();
      // 설치되기 전까진 다음 방문 시 다시 표시
    };
    wrap.appendChild(close);

    document.body.appendChild(wrap);
    return wrap;
  }

  // Chrome/Edge 등: beforeinstallprompt → 네이티브 설치
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    buildBanner(
      "홈 화면에 추가하면 더 빠르게 사용할 수 있어요",
      "설치",
      async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        deferredPrompt = null;
        if (outcome === "accepted") {
          document.getElementById("ps-install-banner")?.remove();
        }
      }
    );
  });

  window.addEventListener("appinstalled", () => {
    document.getElementById("ps-install-banner")?.remove();
  });

  // iOS Safari: beforeinstallprompt 미지원 → 수동 안내
  if (isIOSSafari) {
    setTimeout(() => {
      buildBanner(
        '하단 공유 버튼 → <b>"홈 화면에 추가"</b>',
        null, null
      );
    }, 1500);
  }
})();

// Service Worker 등록 및 자동 업데이트
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("tournament_sw.js", { updateViaCache: "none" }).then((reg) => {
      // 즉시 업데이트 확인 + 5분마다 재확인
      reg.update();
      setInterval(() => reg.update(), 5 * 60 * 1000);
      // 새 SW가 대기 중이면 즉시 활성화
      if (reg.waiting) { reg.waiting.postMessage({ type: "SKIP_WAITING" }); }
      reg.addEventListener("updatefound", () => {
        const newSW = reg.installing;
        if (newSW) {
          newSW.addEventListener("statechange", () => {
            if (newSW.state === "installed" && navigator.serviceWorker.controller) {
              newSW.postMessage({ type: "SKIP_WAITING" });
            }
            if (newSW.state === "activated") {
              window.location.reload();
            }
          });
        }
      });
    }).catch(() => {});
  });
}
</script>
</body>
</html>
